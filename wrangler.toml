# Cloudflare Worker の設定。秘密キー（NOTION_TOKEN）はここに書かず、
# Cloudflare の画面の「Settings → Variables and Secrets」で Secret として登録する。
# 公開アドレスの一部になる名前。推測されにくいよう、ランダムな文字を付けている
name = "hannyu-k7q2m9x4"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
# 開発中はテスト用DB「搬入管理（テスト）」。本番DBへの切り替えは段階5で、Mikotoさんの承認後に行う。
NOTION_DATA_SOURCE_ID = "f5b79079-5493-42ce-8adf-22d15ad899fe"

[assets]
directory = "./public"
binding = "ASSETS"

# 1つの接続元から1分間に60回まで
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 再送時の二重登録防止用の記録場所（KV「hannyu-submissions」）
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "f496c457277b4aa58b6109d046983fe4"
